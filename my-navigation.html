<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的导航页</title>
<style>
:root{--bg:#f5f7fb;--card:rgba(255,255,255,.78);--text:#172033;--muted:#6b7280;--line:#e6e9ef;--accent:#5b6cff;--shadow:0 12px 40px rgba(30,40,80,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 0%,#e9edff 0,transparent 32%),var(--bg);color:var(--text);min-height:100vh;transition:.25s}
body.dark{--bg:#0e1118;--card:rgba(24,29,40,.82);--text:#f2f4f8;--muted:#9aa3b2;--line:#2a3040;--shadow:0 16px 50px rgba(0,0,0,.28);background:radial-gradient(circle at 20% 0%,#1b2348 0,transparent 34%),var(--bg)}
.wrap{max-width:1100px;margin:auto;padding:42px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}.brand{font-size:25px;font-weight:750;letter-spacing:-.5px}.brand span{color:var(--accent)}button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer;font-size:16px}
.hero{text-align:center;margin-bottom:42px}.time{font-size:14px;color:var(--muted);margin-bottom:9px}.hero h1{font-size:clamp(34px,6vw,58px);margin:0 0 25px;letter-spacing:-2px}.search{max-width:720px;margin:auto;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:5px 7px 5px 18px;backdrop-filter:blur(14px)}.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:13px 8px}.search button{background:var(--accent);color:white;border:0;border-radius:12px;padding:12px 18px}
section{margin-top:35px}.section-title{font-size:16px;font-weight:700;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}.card{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 4px 18px rgba(30,40,80,.035);transition:.18s;backdrop-filter:blur(10px)}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfd5ff}.icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#eef0ff;font-size:20px;flex:none}.card small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.add{border-style:dashed;justify-content:center;color:var(--muted);cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:48px}
@media(max-width:600px){.wrap{padding:25px 15px 45px}.top{margin-bottom:35px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:13px}.hero h1{letter-spacing:-1.5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">我的<span>·</span>导航</div>
    <button id="theme" title="切换主题">☾</button>
  </div>

  <div class="hero">
    <div class="time" id="clock"></div>
    <h1>今天，也从这里开始。</h1>
    <form class="search" id="search">
      <input id="q" autocomplete="off" placeholder="搜索任何内容…" autofocus>
      <button>搜索</button>
    </form>
  </div>

  <section>
    <div class="section-title">⭐ 常用</div>
    <div class="grid">
      <a class="card" href="https://www.google.com" target="_blank"><div class="icon">G</div><div>Google<small>搜索</small></div></a>
      <a class="card" href="https://www.youtube.com" target="_blank"><div class="icon">▶</div><div>YouTube<small>视频</small></div></a>
      <a class="card" href="https://www.gmail.com" target="_blank"><div class="icon">✉</div><div>Gmail<small>邮件</small></div></a>
      <a class="card" href="https://drive.google.com" target="_blank"><div class="icon">▣</div><div>Drive<small>云端文件</small></div></a>
    </div>
  </section>

  <section>
    <div class="section-title">🤖 AI & 效率</div>
    <div class="grid">
      <a class="card" href="https://chatgpt.com" target="_blank"><div class="icon">✦</div><div>ChatGPT<small>AI 助手</small></div></a>
      <a class="card" href="https://claude.ai" target="_blank"><div class="icon">C</div><div>Claude<small>AI 助手</small></div></a>
      <a class="card" href="https://www.notion.so" target="_blank"><div class="icon">N</div><div>Notion<small>知识管理</small></div></a>
      <a class="card" href="https://www.figma.com" target="_blank"><div class="icon">◈</div><div>Figma<small>设计</small></div></a>
    </div>
  </section>

  <section>
    <div class="section-title">🎬 娱乐 & 社区</div>
    <div class="grid">
      <a class="card" href="https://www.netflix.com" target="_blank"><div class="icon">N</div><div>Netflix<small>影视</small></div></a>
      <a class="card" href="https://www.reddit.com" target="_blank"><div class="icon">R</div><div>Reddit<small>社区</small></div></a>
      <a class="card" href="https://open.spotify.com" target="_blank"><div class="icon">♫</div><div>Spotify<small>音乐</small></div></a>
      <a class="card" href="https://www.wikipedia.org" target="_blank"><div class="icon">W</div><div>Wikipedia<small>百科</small></div></a>
    </div>
  </section>

  <section>
    <div class="section-title">➕ 自定义</div>
    <div class="grid">
      <div class="card add" id="add">添加网站</div>
    </div>
  </section>

  <div class="footer">你的导航，你的主页 · 设置会保存在当前浏览器</div>
</div>

<script>
const clock=document.getElementById('clock');
function tick(){const d=new Date();clock.textContent=d.toLocaleDateString('zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'  ·  '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
tick();setInterval(tick,1000);
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')};
if(localStorage.dark==='true')document.body.classList.add('dark');
document.getElementById('search').onsubmit=e=>{e.preventDefault();let q=document.getElementById('q').value.trim();if(q)location.href='https://www.google.com/search?q='+encodeURIComponent(q)};
document.getElementById('add').onclick=()=>{let name=prompt('网站名称？');if(!name)return;let url=prompt('网址？例如 https://example.com');if(!url)return;if(!/^https?:\/\//i.test(url))url='https://'+url;let a=document.createElement('a');a.className='card';a.href=url;a.target='_blank';a.innerHTML='<div class="icon">🔗</div><div>'+name.replace(/[<>&]/g,'')+'<small>自定义网站</small></div>';document.querySelector('#add').parentElement.insertBefore(a,document.querySelector('#add'));};
</script>
</body>
</html>
